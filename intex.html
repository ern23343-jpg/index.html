```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>SHIP COMMAND // CONTROL</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#02070b;
    color:#d9f7ff;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#app{
    width:100%;
    height:100%;
    max-width:1400px;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 35%,#09202b 0%,#02070b 45%,#010304 100%);
}

/* TOP BAR */

.top{
    height:75px;
    border-bottom:1px solid #16404d;
    background:rgba(2,10,15,.94);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    position:relative;
    z-index:5;
}

.logo{
    font-size:20px;
    font-weight:bold;
    letter-spacing:4px;
    color:#62eaff;
}

.status{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
    letter-spacing:2px;
}

.statusDot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#555;
    box-shadow:0 0 8px #555;
}

.statusDot.on{
    background:#00ff88;
    box-shadow:0 0 15px #00ff88;
}

/* MAIN */

.main{
    height:calc(100% - 75px);
    display:grid;
    grid-template-columns:250px 1fr 250px;
    gap:12px;
    padding:12px;
}

/* PANELS */

.panel{
    border:1px solid #17424e;
    background:rgba(3,13,18,.88);
    border-radius:10px;
    overflow:hidden;
    box-shadow:inset 0 0 25px rgba(0,180,220,.035);
}

.panelTitle{
    padding:12px;
    border-bottom:1px solid #163944;
    font-size:12px;
    letter-spacing:2px;
    color:#6eeaff;
}

/* LEFT */

.controls{
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

button{
    width:100%;
    min-height:52px;
    border-radius:7px;
    border:1px solid #245461;
    background:linear-gradient(#0b2029,#061117);
    color:#bcefff;
    font-size:13px;
    font-weight:bold;
    letter-spacing:1px;
    cursor:pointer;
    transition:.15s;
}

button:active{
    transform:scale(.96);
}

button:hover{
    border-color:#42dfff;
}

button.active{
    background:linear-gradient(#063d43,#05262b);
    border-color:#00ffcc;
    color:#00ffd5;
    box-shadow:0 0 14px rgba(0,255,210,.18);
}

button.danger{
    border-color:#713636;
    color:#ff7777;
}

button.danger.active{
    background:#3b1010;
    border-color:#ff4444;
    box-shadow:0 0 15px rgba(255,50,50,.2);
}

/* CENTER */

.center{
    position:relative;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.radarArea{
    flex:1;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* RADAR */

.radar{
    width:min(62vh,70vw,570px);
    height:min(62vh,70vw,570px);
    max-width:570px;
    max-height:570px;
    border-radius:50%;
    border:2px solid #177486;
    position:relative;
    background:
        radial-gradient(circle,
        transparent 0 18%,
        rgba(0,180,210,.08) 18.5% 19%,
        transparent 19.5% 38%,
        rgba(0,180,210,.08) 38.5% 39%,
        transparent 39.5% 58%,
        rgba(0,180,210,.08) 58.5% 59%,
        transparent 59.5%);
    box-shadow:
        0 0 30px rgba(0,200,230,.12),
        inset 0 0 50px rgba(0,170,210,.08);
}

.radar::before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    width:1px;
    height:100%;
    background:#176272;
}

.radar::after{
    content:"";
    position:absolute;
    top:50%;
    left:0;
    width:100%;
    height:1px;
    background:#176272;
}

.scan{
    position:absolute;
    width:50%;
    height:2px;
    top:50%;
    left:50%;
    transform-origin:left center;
    background:linear-gradient(90deg,#00ffb7,transparent);
    box-shadow:0 0 12px #00ffb7;
    animation:scan 3s linear infinite;
}

@keyframes scan{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

.blip{
    position:absolute;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#00ffb7;
    box-shadow:0 0 14px #00ffb7;
    animation:blip 1.5s infinite alternate;
}

@keyframes blip{
    from{opacity:.35}
    to{opacity:1}
}

.b1{left:67%;top:28%}
.b2{left:31%;top:63%}
.b3{left:73%;top:70%}
.b4{left:24%;top:39%}

.radar.off .scan{
    display:none;
}

.radar.off .blip{
    display:none;
}

.radar.off{
    opacity:.3;
    filter:grayscale(1);
}

/* RADAR INFO */

.radarInfo{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    font-size:10px;
    letter-spacing:2px;
    color:#52dced;
}

/* BOTTOM */

.bottom{
    height:150px;
    border-top:1px solid #17424e;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    padding:10px;
}

.stat{
    border:1px solid #123b46;
    border-radius:8px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#041016;
}

.statLabel{
    color:#588b98;
    font-size:10px;
    letter-spacing:2px;
}

.statValue{
    margin-top:8px;
    font-size:25px;
    font-weight:bold;
    color:#c9f9ff;
}

/* RIGHT */

.monitor{
    padding:12px;
}

.gauge{
    margin-bottom:20px;
}

.gaugeHead{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    margin-bottom:7px;
    color:#79aeb9;
}

.bar{
    height:12px;
    background:#071319;
    border:1px solid #17414c;
    border-radius:20px;
    overflow:hidden;
}

.fill{
    height:100%;
    width:100%;
    background:#00dca8;
    box-shadow:0 0 10px rgba(0,255,190,.4);
    transition:.3s;
}

.fuel{
    background:#ffd84d;
}

.temp{
    background:#46bfff;
}

.system{
    margin-top:15px;
    border-top:1px solid #173a43;
    padding-top:15px;
}

.systemRow{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    font-size:11px;
    color:#6f9ca6;
}

.ok{
    color:#00ff9d;
}

.warn{
    color:#ffd84d;
}

.offText{
    color:#777;
}

/* WATER */

.water{
    position:absolute;
    left:0;
    right:0;
    bottom:-5px;
    height:100px;
    overflow:hidden;
    pointer-events:none;
    opacity:.65;
}

.wave{
    position:absolute;
    width:200%;
    height:50px;
    left:-50%;
    border-top:2px solid #0a6073;
    border-radius:50%;
    animation:wave 5s linear infinite;
}

.wave:nth-child(1){top:20px}
.wave:nth-child(2){top:42px;animation-duration:7s}
.wave:nth-child(3){top:65px;animation-duration:9s}

@keyframes wave{
    from{transform:translateX(0)}
    to{transform:translateX(25%)}
}

/* ALERT */

.alert{
    position:absolute;
    top:88px;
    left:50%;
    transform:translateX(-50%);
    background:#420c0c;
    color:#ff6b6b;
    border:1px solid #ff4141;
    padding:10px 18px;
    border-radius:7px;
    font-size:11px;
    letter-spacing:2px;
    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:20;
}

.alert.show{
    opacity:1;
}

/* MOBILE */

@media(max-width:850px){

    body{
        overflow:auto;
    }

    #app{
        min-height:100%;
        height:auto;
    }

    .top{
        height:65px;
    }

    .main{
        height:auto;
        min-height:calc(100vh - 65px);
        grid-template-columns:1fr;
        grid-template-rows:auto auto auto;
    }

    .left{
        order:2;
    }

    .center{
        order:1;
        min-height:570px;
    }

    .right{
        order:3;
    }

    .radar{
        width:min(82vw,430px);
        height:min(82vw,430px);
    }

    .bottom{
        height:125px;
    }

    .controls{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .panelTitle{
        text-align:center;
    }

    .logo{
        font-size:15px;
        letter-spacing:2px;
    }
}

@media(max-width:450px){

    .top{
        padding:0 12px;
    }

    .status{
        font-size:9px;
    }

    .center{
        min-height:480px;
    }

    .radar{
        width:78vw;
        height:78vw;
    }

    .bottom{
        grid-template-columns:1fr 1fr 1fr;
    }

    .statValue{
        font-size:20px;
    }

    .controls{
        grid-template-columns:1fr 1fr;
    }

    button{
        min-height:48px;
        font-size:11px;
    }
}
</style>
</head>

<body>

<div id="app">

<header class="top">

    <div class="logo">
        ⚓ SHIP COMMAND
    </div>

    <div class="status">
        SYSTEM
        <span id="statusDot" class="statusDot"></span>
        <span id="systemText">OFFLINE</span>
    </div>

</header>

<div id="alert" class="alert">
    ⚠ SİSTEM UYARISI
</div>

<main class="main">

<!-- LEFT -->

<section class="panel left">

    <div class="panelTitle">
        NAVIGATION
    </div>

    <div class="controls">

        <button id="engineBtn" onclick="toggleEngine()">
            🔴 MOTOR AÇ
        </button>

        <button id="radarBtn" onclick="toggleRadar()">
            📡 RADAR AÇ
        </button>

        <button onclick="moveShip(1)">
            ▲ İLERİ
        </button>

        <button onclick="moveShip(-1)">
            ▼ GERİ
        </button>

        <button onclick="stopShip()">
            ■ DUR
        </button>

        <button id="lightsBtn" onclick="toggleLights()">
            💡 IŞIKLAR
        </button>

        <button id="alarmBtn"
                class="danger"
                onclick="alarm()">
            🚨 ALARM
        </button>

    </div>

</section>


<!-- CENTER -->

<section class="panel center">

    <div class="panelTitle">
        MARINE RADAR // LIVE
    </div>

    <div class="radarArea">

        <div id="radar" class="radar off">

            <div class="radarInfo">
                <span>RANGE 12 NM</span>
                <span id="radarStatus">STANDBY</span>
            </div>

            <div class="scan"></div>

            <div class="blip b1"></div>
            <div class="blip b2"></div>
            <div class="blip b3"></div>
            <div class="blip b4"></div>

        </div>

        <div class="water">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>

    </div>


    <div class="bottom">

        <div class="stat">
            <div class="statLabel">SPEED</div>
            <div class="statValue">
                <span id="speed">0</span> KN
            </div>
        </div>

        <div class="stat">
            <div class="statLabel">HEADING</div>
            <div class="statValue">
                <span id="heading">090</span>°
            </div>
        </div>

        <div class="stat">
            <div class="statLabel">DEPTH</div>
            <div class="statValue">
                <span id="depth">124</span> M
            </div>
        </div>

    </div>

</section>


<!-- RIGHT -->

<section class="panel right">

    <div class="panelTitle">
        ENGINE MONITOR
    </div>

    <div class="monitor">

        <div class="gauge">

            <div class="gaugeHead">
                <span>FUEL</span>
                <span id="fuelText">100%</span>
            </div>

            <div class="bar">
                <div id="fuelBar" class="fill fuel"></div>
            </div>

        </div>


        <div class="gauge">

            <div class="gaugeHead">
                <span>ENGINE POWER</span>
                <span id="powerText">0%</span>
            </div>

            <div class="bar">
                <div id="powerBar" class="fill"></div>
            </div>

        </div>


        <div class="gauge">

            <div class="gaugeHead">
                <span>TEMPERATURE</span>
                <span id="tempText">22°C</span>
            </div>

            <div class="bar">
                <div id="tempBar" class="fill temp"></div>
            </div>

        </div>


        <div class="system">

            <div class="systemRow">
                <span>MAIN ENGINE</span>
                <b id="engineState" class="offText">OFF</b>
            </div>

            <div class="systemRow">
                <span>RADAR</span>
                <b id="radarState" class="offText">OFF</b>
            </div>

            <div class="systemRow">
                <span>NAVIGATION</span>
                <b id="navState" class="offText">STANDBY</b>
            </div>

            <div class="systemRow">
                <span>LIGHTS</span>
                <b id="lightState" class="offText">OFF</b>
            </div>

        </div>

    </div>

</section>

</main>

</div>


<script>

let engine=false;
let radar=false;
let lights=false;

let speed=0;
let fuel=100;
let power=0;
let temp=22;
let heading=90;
let depth=124;

let audioCtx=null;
let oscillator=null;


/* AUDIO */

function startSound(){

    if(!audioCtx){
        audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    }

    if(oscillator) return;

    oscillator=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    oscillator.type="sawtooth";
    oscillator.frequency.value=70;

    gain.gain.value=.035;

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start();
}

function stopSound(){

    if(oscillator){
        oscillator.stop();
        oscillator.disconnect();
        oscillator=null;
    }
}


/* ENGINE */

function toggleEngine(){

    engine=!engine;

    const btn=document.getElementById("engineBtn");
    const state=document.getElementById("engineState");
    const dot=document.getElementById("statusDot");
    const system=document.getElementById("systemText");

    if(engine){

        btn.classList.add("active");
        btn.innerHTML="🟢 MOTOR KAPAT";

        state.innerText="RUNNING";
        state.className="ok";

        dot.classList.add("on");
        system.innerText="ONLINE";

        startSound();

        showAlert("✓ MOTOR ÇALIŞTIRILDI");

    }else{

        btn.classList.remove("active");
        btn.innerHTML="🔴 MOTOR AÇ";

        state.innerText="OFF";
        state.className="offText";

        dot.classList.remove("on");
        system.innerText="OFFLINE";

        stopSound();

        speed=0;
        power=0;

        showAlert("MOTOR KAPATILDI");
    }
}


/* RADAR */

function toggleRadar(){

    radar=!radar;

    const r=document.getElementById("radar");
    const btn=document.getElementById("radarBtn");

    const state=document.getElementById("radarState");
    const rs=document.getElementById("radarStatus");

    if(radar){

        r.classList.remove("off");

        btn.classList.add("active");
        btn.innerHTML="🟢 RADAR KAPAT";

        state.innerText="ACTIVE";
        state.className="ok";

        rs.innerText="SCANNING";

        showAlert("📡 RADAR AKTİF");

    }else{

        r.classList.add("off");

        btn.classList.remove("active");
        btn.innerHTML="📡 RADAR AÇ";

        state.innerText="OFF";
        state.className="offText";

        rs.innerText="STANDBY";
    }
}


/* LIGHTS */

function toggleLights(){

    lights=!lights;

    const btn=document.getElementById("lightsBtn");
    const state=document.getElementById("lightState");

    if(lights){

        btn.classList.add("active");
        btn.innerHTML="💡 IŞIKLAR KAPAT";

        state.innerText="ON";
        state.className="ok";

    }else{

        btn.classList.remove("active");
        btn.innerHTML="💡 IŞIKLAR";

        state.innerText="OFF";
        state.className="offText";
    }
}


/* MOVEMENT */

function moveShip(direction){

    if(!engine){

        showAlert("⚠ ÖNCE MOTORU AÇ!");

        return;
    }

    if(direction===1){

        speed=Math.min(speed+3,32);

        heading+=2;

        if(heading>=360)
            heading-=360;

    }else{

        speed=Math.max(speed-3,0);

        heading-=2;

        if(heading<0)
            heading+=360;
    }

    power=Math.min(100,speed*3);

    document.getElementById("navState").innerText=
        direction===1 ? "FORWARD" : "REVERSE";

    document.getElementById("navState").className="ok";
}


/* STOP */

function stopShip(){

    speed=0;
    power=0;

    document.getElementById("navState").innerText="STOPPED";
    document.getElementById("navState").className="warn";
}


/* ALARM */

function alarm(){

    showAlert("🚨 ACİL DURUM ALARMI!");

    const beep=new AudioContext();
    const osc=beep.createOscillator();
    const gain=beep.createGain();

    osc.frequency.value=700;
    gain.gain.value=.08;

    osc.connect(gain);
    gain.connect(beep.destination);

    osc.start();

    setTimeout(()=>{
        osc.stop();
        beep.close();
    },500);
}


/* ALERT */

function showAlert(text){

    const a=document.getElementById("alert");

    a.innerText=text;
    a.classList.add("show");

    setTimeout(()=>{
        a.classList.remove("show");
    },1800);
}


/* UPDATE */

setInterval(()=>{

    if(engine){

        fuel-=speed*.002;

        if(fuel<0)
            fuel=0;

        temp=22+power*.42;

        if(speed>0){

            depth+=Math.random()>.5 ? 1 : -1;

            if(depth<80)
                depth=80;

            if(depth>180)
                depth=180;
        }

    }else{

        temp-=.2;

        if(temp<22)
            temp=22;
    }


    document.getElementById("speed").innerText=
        speed.toFixed(0);

    document.getElementById("heading").innerText=
        String(Math.round(heading)).padStart(3,"0");

    document.getElementById("depth").innerText=
        depth;

    document.getElementById("fuelText").innerText=
        fuel.toFixed(0)+"%";

    document.getElementById("fuelBar").style.width=
        fuel+"%";

    document.getElementById("powerText").innerText=
        power.toFixed(0)+"%";

    document.getElementById("powerBar").style.width=
        power+"%";

    document.getElementById("tempText").innerText=
        temp.toFixed(0)+"°C";

    document.getElementById("tempBar").style.width=
        Math.min(100,temp)+"%";

},1000);

</script>

</body>
</html>
```
